title: TecnoHead Meter Reader — Laboratório Serial
views:
  - title: Meter Reader
    path: tecnohead-meter-reader
    icon: mdi:meter-electric-outline
    badges:
      - entity: binary_sensor.tecnohead_meter_reader_api_conectada
      - entity: binary_sensor.tecnohead_meter_reader_ha_trafego_rx
    cards:
      - type: markdown
        content: |
          # TecnoHead Meter Reader
          Laboratório de captura **passiva RX**. GPIO16 é RX TTL 3,3 V; GPIO17 permanece reservado e desativado.

          **Sem bytes recebidos** não significa que a porta esteja desabilitada: RS232 pode exigir requisição/autenticação e a fase 1 não transmite nada.
      - type: grid
        columns: 2
        square: false
        cards:
          - type: entities
            title: Estado do dispositivo
            show_header_toggle: false
            entities:
              - entity: binary_sensor.tecnohead_meter_reader_api_conectada
                name: API ESPHome / HA
              - entity: binary_sensor.tecnohead_meter_reader_ha_trafego_rx
                name: Há tráfego RX
