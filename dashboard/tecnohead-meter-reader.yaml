      - type: markdown
        content: |
          ## HEX e ASCII
          **HEX (prévia curta):** `{{ states('text_sensor.tecnohead_meter_reader_ultimo_frame_hex') }}`

          **ASCII seguro:** `{{ states('text_sensor.tecnohead_meter_reader_ultimo_frame_ascii') }}`

          A prévia pode ser truncada com indicação de bytes restantes. A captura íntegra não é armazenada como estado do Recorder: abra o painel lateral **TecnoHead Meter Reader** para o console, buffer circular e exportação `.bin`, `.jsonl` e `.csv`.
      - type: markdown
        content: |
          ## Segurança e escopo
          - Bancada: gerador UART TTL 3,3 V → GPIO16, com GND comum somente no circuito de bancada.
          - Futuro Nansen: interface RS232 autorizada → conversor RS232/UART com isolamento galvânico validado → GPIO16.
          - Não ligar GPIO16, GPIO17, 3V3 ou GND diretamente aos bornes RS232; não romper lacre, não tocar a porta óptica e não fazer consultas TX.
          - Hipóteses DLMS/HDLC ou ABNT são somente indicativas; códigos de visor 03/103 não são endereços OBIS.
