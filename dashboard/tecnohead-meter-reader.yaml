                name: Configuração aplicada
              - entity: text_sensor.tecnohead_meter_reader_canal_de_captura
                name: Canal de captura
              - entity: switch.tecnohead_meter_reader_tx_reservado_desativado
                name: TX reservado (deve ficar desligado)
          - type: entities
            title: Saúde do ESP32
            show_header_toggle: false
            entities:
