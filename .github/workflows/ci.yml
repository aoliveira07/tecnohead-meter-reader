name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest
      - run: python -m compileall capture-console/app tests

  app-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Validate App metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path('capture-console/config.yaml').read_text())
          assert cfg['slug'] == 'tecnohead_meter_reader'
          assert cfg['ingress'] is True and cfg['homeassistant_api'] is True
          assert 'mqtt:want' in cfg['services']
          assert set(cfg['arch']) == {'amd64', 'aarch64'}
          print('config.yaml OK')
          PY

  container:
    needs: [tests, app-config]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./capture-console
          file: ./capture-console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: tecnohead-meter-reader:ci
